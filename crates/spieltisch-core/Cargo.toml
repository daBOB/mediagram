[package]
name = "spieltisch-core"
description = "Spieltisch's native core: hosts the game night on the TV box and lists its games, for the Android app"
# Spieltisch's own version line, in step with crates/mediagram-game; android/controller reads it from here.
version = "0.181.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]

[dependencies]
mediagram-game = { path = "../mediagram-game" }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
tracing.workspace = true
# The same version and features as mediagram-core's, so both libraries' bindings come from one generator.
uniffi = { version = "0.32.0", features = ["tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
tempfile.workspace = true
