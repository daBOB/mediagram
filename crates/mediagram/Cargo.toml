[package]
name = "mediagram"
description = "Linux uploader for a Telegram-backed personal video library (the mlib format)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
directories = "6.0.0"
flate2.workspace = true
futures.workspace = true
glass_pumpkin.workspace = true
grammers-client.workspace = true
grammers-mtsender.workspace = true
grammers-session = "0.10"
grammers-tl-types.workspace = true
hex.workspace = true
# setsid, so a backgrounded upload gets a session of its own and survives
# the terminal it was started from closing.
libc = "0.2"
mediagram-core = { path = "../mediagram-core" }
mediagram-tmdb = { path = "../mediagram-tmdb" }
mlib-spec = { path = "../mlib-spec" }
# `rustls-no-provider`: every client is built by `mediagram_core::api::http`,
# on ring and the webpki roots, so naming a provider here would only link a
# second crypto stack (aws-lc) that nothing uses.
reqwest = { workspace = true, features = ["rustls-no-provider", "json"] }
# Not "bundled": grammers-session already statically links its own copy of
# sqlite3 (via libsql-ffi), and two bundled copies in one binary collide at
# link time with duplicate `sqlite3_*` symbols. Linking against the system
# library avoids the clash.
rusqlite = { version = "0.40.2", features = ["fallible_uint"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
strsim = "0.11.1"
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "time", "process"] }
toml = "1.1.6"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid.workspace = true

[dev-dependencies]
tempfile.workspace = true
