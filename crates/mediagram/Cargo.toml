[package]
name = "mediagram"
description = "Linux uploader for a Telegram-backed personal video library (mlib v2)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
directories = "6.0.0"
flate2 = "1.1.10"
futures = "0.3.34"
# Pinned, not used directly: grammers-crypto 0.10 calls glass_pumpkin's rc0
# `safe_prime::check` (returns bool, takes num-bigint 0.4). rc1 returns a
# Result and moved to num-bigint 0.5, so a plain `cargo update` picks it up
# — both are prereleases of 2.0.0 — and grammers stops compiling. Drop this
# once grammers-crypto builds against rc1.
glass_pumpkin = "=2.0.0-rc0"
grammers-client = "0.10"
grammers-mtsender = "0.10"
grammers-session = "0.10"
grammers-tl-types = "0.10"
hex.workspace = true
# setsid, so a backgrounded upload gets a session of its own and survives
# the terminal it was started from closing.
libc = "0.2"
mediagram-core = { path = "../mediagram-core" }
mediagram-tmdb = { path = "../mediagram-tmdb" }
mlib-spec = { path = "../mlib-spec" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
# Not "bundled": grammers-session already statically links its own copy of
# sqlite3 (via libsql-ffi), and two bundled copies in one binary collide at
# link time with duplicate `sqlite3_*` symbols. Linking against the system
# library avoids the clash.
rusqlite = "0.40.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
strsim = "0.11.1"
tar = "0.4.46"
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "time", "process"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid.workspace = true

[dev-dependencies]
mediagram-tmdb = { path = "../mediagram-tmdb" }
tempfile = "3.27.0"
