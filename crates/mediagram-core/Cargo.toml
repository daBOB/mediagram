[package]
name = "mediagram-core"
description = "Portable core of the mlib client: Telegram transport and index, shared by the Linux CLI and the Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1"
base64 = "0.23.1"
bytes = "1"
flate2 = "1.1.10"
futures = "0.3.34"
getrandom = "0.3"
# Pinned, not used directly: grammers-crypto 0.10 calls glass_pumpkin's rc0
# `safe_prime::check` (returns bool, takes num-bigint 0.4). rc1 returns a
# Result and moved to num-bigint 0.5, so a plain `cargo update` picks it up
# — both are prereleases of 2.0.0 — and grammers stops compiling. Drop this
# once grammers-crypto builds against rc1.
glass_pumpkin = "=2.0.0-rc0"
grammers-client = "0.10"
grammers-tl-types = "0.10"
hex = { workspace = true }
mlib-spec = { path = "../mlib-spec" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = "0.4.46"
thiserror = { workspace = true }
uniffi = "0.32.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }

# Exactly one sqlite3 may end up in the binary, and which crate supplies it
# differs by platform. Both shapes are spelled per-target so that a host build
# never sees the Android one: the workspace resolver ignores features on
# target-specific dependencies whose target is not being built, so the CLI,
# which shares these crates, keeps linking as it always has.

# The NDK sysroot ships no libsqlite3, so the index has to carry its own. That
# is safe only because the session store drops libsql's copy in the same
# breath — two static sqlite3 in one binary collide on duplicate symbols. The
# session is held as a MemorySession rebuilt from the stored auth key instead.
[target.'cfg(target_os = "android")'.dependencies]
grammers-session = { version = "0.10", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Off Android there is a system libsqlite3 to link against, so rusqlite needs
# no copy of its own and the session store keeps its sqlite-backed storage.
[target.'cfg(not(target_os = "android"))'.dependencies]
grammers-session = "0.10"
rusqlite = "0.40.2"

[dev-dependencies]
tempfile = "3.27.0"
