[package]
name = "mediagram-core"
description = "Portable core of the mlib client: Telegram transport and index, shared by the Linux CLI and the Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]

[dependencies]
aes-gcm = "0.11.1"
anyhow.workspace = true
base64.workspace = true
bytes = "1"
flate2.workspace = true
futures.workspace = true
getrandom = "0.3"
glass_pumpkin.workspace = true
grammers-client.workspace = true
grammers-mtsender.workspace = true
grammers-tl-types.workspace = true
hex = { workspace = true }
mediagram-tmdb = { path = "../mediagram-tmdb" }
mlib-spec = { path = "../mlib-spec" }
# `rustls-no-provider`, not `rustls`: the latter pulls in `rustls-platform-verifier`
# on the same code path this crate would actually exercise, and that crate
# panics on Android ("expect rustls-platform-verifier to be initialized")
# without a Kotlin companion component and a JNI init call neither of which
# this project has. `api::http` builds its own `rustls::ClientConfig` — a
# plain webpki-roots verifier, never the platform one — and installs it via
# `tls_backend_preconfigured`, so `rustls-platform-verifier` stays linked
# (reqwest requires the dependency to exist) but its verifier is never
# reached.
reqwest = { workspace = true, features = ["rustls-no-provider", "json"] }
# `ring`, not the default `aws_lc_rs`: `aws-lc-rs` compiles a BoringSSL-derived
# C library (`aws-lc-sys`) via cmake, a second native crypto stack beside
# grammers' pure-Rust RustCrypto and a standing Android cross-compile hazard.
# `ring` also embeds C/assembly, but is the long-established, widely
# cross-compiled-for-Android choice; a pure-Rust rustls provider
# (`rustls-rustcrypto`) exists but is 0.0.2-alpha and not something to trust
# with TLS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar.workspace = true
thiserror = { workspace = true }
tracing.workspace = true
url = "2"
# The version reaching Android: chosen because it is the newest release
# already exercised by this workspace's lockfile at the time this surface
# was built. `cli` is deliberately not enabled here — see the crate's own
# `cli` feature below; enabling it unconditionally would make Android builds
# compile the whole bindings code generator into the app's dependency graph.
uniffi = { version = "0.32.0", features = ["tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
webpki-roots = "1"

# Exactly one sqlite3 may end up in the binary, and which crate supplies it
# differs by platform. Both shapes are spelled per-target so that a host build
# never sees the Android one: the workspace resolver ignores features on
# target-specific dependencies whose target is not being built, so the CLI,
# which shares these crates, keeps linking as it always has.

# The NDK sysroot ships no libsqlite3, so the index has to carry its own. That
# is safe only because the session store drops libsql's copy in the same
# breath — two static sqlite3 in one binary collide on duplicate symbols. The
# session is held as a MemorySession rebuilt from the stored auth key instead.
[target.'cfg(target_os = "android")'.dependencies]
grammers-session = { version = "0.10", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Off Android there is a system libsqlite3 to link against, so rusqlite needs
# no copy of its own and the session store keeps its sqlite-backed storage.
[target.'cfg(not(target_os = "android"))'.dependencies]
grammers-session = "0.10"
rusqlite = "0.40.2"

[dev-dependencies]
tempfile.workspace = true
