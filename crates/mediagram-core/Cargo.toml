[package]
name = "mediagram-core"
description = "Portable core of the mlib client: Telegram transport and index, shared by the Linux CLI and the Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
# Pinned, not used directly: grammers-crypto 0.10 calls glass_pumpkin's rc0
# `safe_prime::check` (returns bool, takes num-bigint 0.4). rc1 returns a
# Result and moved to num-bigint 0.5, so a plain `cargo update` picks it up
# — both are prereleases of 2.0.0 — and grammers stops compiling. Drop this
# once grammers-crypto builds against rc1.
glass_pumpkin = "=2.0.0-rc0"
grammers-client = "0.10"
# default-features = false drops "sqlite-storage", and with it libsql's
# statically-linked sqlite3. The session is held as a MemorySession rebuilt
# from the stored auth key instead, leaving exactly one sqlite in the binary.
grammers-session = { version = "0.10", default-features = false }
grammers-tl-types = "0.10"
hex = { workspace = true }
mlib-spec = { path = "../mlib-spec" }
# "bundled", unlike the CLI crate: the Android NDK sysroot ships no
# libsqlite3, so the index has to carry its own. It is safe here only because
# the session store above no longer brings a second one — two static copies in
# one binary collide on duplicate `sqlite3_*` symbols.
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = { workspace = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
