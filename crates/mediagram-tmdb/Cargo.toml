[package]
name = "mediagram-tmdb"
description = "TMDB lookups and poster artwork, shared by the uploader and the mobile core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
hex.workspace = true
mlib-spec = { path = "../mlib-spec" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
# No TLS provider is named here: the client comes from the caller, and
# Cargo unifies features per target, so one chosen here would be chosen for
# every build that links this crate.
reqwest = { workspace = true, features = ["json"] }
