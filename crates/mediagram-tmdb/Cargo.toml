[package]
name = "mediagram-tmdb"
description = "TMDB lookups and poster artwork, shared by the uploader and the mobile core"
categories = ["api-bindings", "multimedia"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true

[dependencies]
anyhow.workspace = true
hex.workspace = true
mlib-spec = { path = "../mlib-spec" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "macros", "rt"] }
tracing.workspace = true
# No TLS provider is named here: the client comes from the caller, and
# Cargo unifies features per target, so one chosen here would be chosen for
# every build that links this crate.
reqwest = { workspace = true, features = ["json"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros"] }
# reqwest here has no TLS provider of its own, and building any client
# panics without one installed, even for a plain-http test server.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
