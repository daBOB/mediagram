[package]
name = "mediagram-game"
description = "Game night: party games hosted on the TV box, joined from phones"
# Spieltisch's own version line, in step with crates/spieltisch-core and the client's package.json.
version = "0.182.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
axum = { workspace = true, features = ["ws"] }
futures.workspace = true
qrcode.workspace = true
# debug-embed: debug builds embed the pages too, since the Android library
# cannot read the dev machine's disk.
rust-embed = { workspace = true, features = ["debug-embed", "mime-guess"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "game-night-dev"
path = "src/bin/game-night-dev.rs"

[[bin]]
name = "grand-allee-sim"
path = "src/bin/grand-allee-sim.rs"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
