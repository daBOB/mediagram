# libs.versions.toml
[versions]
activityCompose = "1.13.0"
agp = "9.3.1"
androidxAnnotation = "1.10.0"
# androidx.benchmark and the androidx.baselineprofile plugin release together; 1.5.0 is the latest stable and its plugin needs no AGP opt-out on AGP 9.
androidxBenchmark = "1.5.0"
androidxHilt = "1.4.0"
androidxTestRunner = "1.7.0"
androidxSecurityCrypto = "1.1.0"
checkerQual = "3.43.0"
coil = "3.5.0"
compileSdk = "37"
compose-bom = "2026.06.01"
composeRules = "0.6.3"
core = "1.19.0"
coroutines = "1.11.0"
desugarJdk = "2.1.5"
detekt = "2.0.0-alpha.5"
espressoCore = "3.7.0"
hilt = "2.60.1"
jna = "5.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
kotlin = "2.3.21"
kotlinxSerialization = "1.11.0"
ksp = "2.3.10"
# ktlint = the ktlint *engine* version consumed by Spotless's ktlint(...) step (com.pinterest.ktlint).
# ktlintPlugin = the standalone org.jlleitschuh.gradle.ktlint plugin; unrelated version line.
ktlint = "1.8.0"
ktlintPlugin = "14.2.0"
lifecycleRuntimeCompose = "2.11.0"
lifecycleRuntimeKtx = "2.11.0"
lifecycleViewmodel = "2.11.0"
material3 = "1.4.0"
materialAdaptive = "1.3.0-rc01"
# core/ffmpeg vendors Media3's decoder_ffmpeg from this tag, so a bump here must
# re-copy its Java sources (core/ffmpeg/build.gradle.kts) and rebuild the native
# half with ../scripts/build-android-ffmpeg.sh at the same tag.
media3 = "1.10.1"
minSdk = "24"
mockkVersion = "1.14.11"
mockwebserver = "5.4.0"
profileinstaller = "1.4.1"
robolectric = "4.16.1"
spotless = "8.8.0"
targetSdk = "37"
truth = "1.4.5"
turbine = "1.2.1"
tvMaterial = "1.1.0"
uiautomator = "2.4.0"

[libraries]
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
# The core icon set only, not the extended one: two glyphs are needed and
# the extended artifact is thousands.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "materialAdaptive" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-core-desugaring = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdk" }
# androidx.core 1.19.0 merged the core-ktx extensions into androidx.core:core; core-ktx is an empty compatibility artifact.
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
# hiltViewModel() lives here since androidx.hilt 1.3.0; hilt-navigation-compose would drag in androidx.navigation.
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodel" }
androidx-media3-database = { group = "androidx.media3", name = "media3-database", version.ref = "media3" }
androidx-media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
androidx-media3-decoder = { group = "androidx.media3", name = "media3-decoder", version.ref = "media3" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "androidxSecurityCrypto" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRules" }
spotless-gradlePlugin = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version.ref = "spotless" }
google-truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
checker-qual = { group = "org.checkerframework", name = "checker-qual", version.ref = "checkerQual" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-composeGradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
mockk = { module = "io.mockk:mockk", version.ref = "mockkVersion" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
plugin-detekt = { group = "dev.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[bundles]
# material3 is deliberately not here: this bundle reaches every Compose
# module including ui-tv, which must never see M3 at compile time. Modules
# that draw with M3 (core:designsystem, ui-mobile via app.android.mobile.screen)
# declare it themselves.
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-foundation"
]

unit-test = [
    "junit",
    "kotlin-test-junit",
    "kotlinx-coroutines-test",
    "turbine",
    "google-truth"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidxBenchmark" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Convention plugins (no version, resolved from build-logic)
app-android-application = { id = "app.android.application" }
app-android-application-compose = { id = "app.android.application.compose" }
app-android-library = { id = "app.android.library" }
app-android-library-compose = { id = "app.android.library.compose" }
app-android-mobile-screen = { id = "app.android.mobile.screen" }
app-android-security-crypto = { id = "app.android.security.crypto" }
app-android-test = { id = "app.android.test" }
app-detekt = { id = "app.detekt" }
app-hilt = { id = "app.hilt" }
app-jvm-library = { id = "app.jvm.library" }
app-spotless = { id = "app.spotless" }