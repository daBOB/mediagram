org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
# Profile generation runs on the household TV box, and AGP uninstalls the tested
# APKs after a connected run by default. An uninstall wipes the box's Telegram
# session and settings, so the app and the test APK are left installed.
android.injected.androidTest.leaveApksInstalledAfterRun=true
