<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mediagram</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <nav>
      <div class="brand">mediagram</div>
      <a href="#/movies" data-section="movies">Movies <span class="n" id="n-movies"></span></a>
      <a href="#/series" data-section="series">Series <span class="n" id="n-series"></span></a>
      <a href="#/tutorials" data-section="tutorials">Tutorials <span class="n" id="n-tutorials"></span></a>
      <div class="foot" id="foot"></div>
    </nav>

    <main id="main"><p class="empty">Loading…</p></main>

    <dialog id="player">
      <video id="video" controls preload="metadata" crossorigin="anonymous"></video>
      <p class="note" id="note" hidden></p>
      <div class="summary" id="summary" hidden></div>
      <div class="bar">
        <span class="what" id="now"></span>
        <button id="close">Close</button>
      </div>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
