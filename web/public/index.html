<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mediagram</title>
    <meta name="color-scheme" content="dark light" />
    <!-- Before any stylesheet: sets the theme, so the first paint is right. -->
    <script src="/lib/appearance-boot.js"></script>
    <!-- Interface text and display serif are both available offline; the text
         serif is left to load on first use, below the fold. -->
    <link rel="preload" href="/font/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/font/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The library and the screening room share tokens, not layout rules. -->
    <link rel="stylesheet" href="/styles/theme.css" />
    <link rel="stylesheet" href="/styles/shell.css" />
    <link rel="stylesheet" href="/styles/catalog.css" />
    <link rel="stylesheet" href="/styles/home.css" />
    <link rel="stylesheet" href="/styles/title-page.css" />
    <link rel="stylesheet" href="/styles/departments.css" />
    <link rel="stylesheet" href="/styles/appearance.css" />
    <link rel="stylesheet" href="/styles/library-controls.css" />
    <link rel="stylesheet" href="/styles/playback.css" />
    <!-- The deepest modules the first shelf's own render reaches, fetched
         alongside the shallower ones that import them rather than after: an
         `@import`-style chain of five whole round trips deep, flattened to
         about two. The player's own modules are loaded separately, lazily —
         see `app.js`. -->
    <link rel="modulepreload" href="/lib/library.js" />
    <link rel="modulepreload" href="/lib/watch-state.js" />
    <link rel="modulepreload" href="/lib/playable.js" />
    <link rel="modulepreload" href="/lib/codec-support.js" />
    <link rel="modulepreload" href="/lib/link.js" />
    <link rel="modulepreload" href="/lib/catalog/set-badge.js" />
    <link rel="modulepreload" href="/lib/catalog/plate.js" />
    <link rel="modulepreload" href="/lib/catalog/shelf-view.js" />
    <link rel="modulepreload" href="/lib/catalog/course-view.js" />
  </head>
  <body>
    <button type="button" class="skip-link" id="skip-library">Skip to library</button>
    <!-- Two navigations, each link in one of them: the departments along
         the top, the viewer's shelves and utilities down the side. -->
    <aside class="library-rail">
      <!-- The wordmark goes where a masthead's does: back to the front page. -->
      <a class="brand" href="#/home">mediagram</a>
      <!-- The reader's own shelves and the utilities. The library's
           departments are the bar along the top, and only there. -->
      <nav class="rail-nav" aria-label="Your shelves">
        <a href="#/watchlist" data-section="watchlist" class="kept"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-3.8-5.5 3.8z"></path></svg><span class="label">My List</span><span class="n" id="n-watchlist"></span></a>
        <a href="#/continue" data-section="continue" class="kept"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M10.2 8.6v6.8l5.6-3.4z"></path></svg><span class="label">Continue watching</span><span class="n" id="n-continue"></span></a>
        <a href="#/latest" data-section="latest" class="kept"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg><span class="label">Latest</span></a>
        <a href="#/genres" data-section="genres" class="kept"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3-8.7 8.7z"></path><circle cx="8" cy="8" r="1.4"></circle></svg><span class="label">Genres</span></a>
        <a href="#/settings" data-section="settings" class="kept"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4 6 18M18 18l-1.6-1.6M7.6 7.6 6 6"></path></svg><span class="label">Settings</span></a>
        <!-- Not a shelf: what the player itself is doing. Hidden until
             `/api/status` answers, which it does for this household's own
             devices. A viewer from outside is never shown a way in to a page
             they would get a 404 from. -->
        <a href="#/system" data-section="system" class="apart" id="nav-system" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg><span class="label">System</span></a>
      </nav>
      <!-- The masthead line a magazine prints under its name, set from what
           the library actually holds rather than a slogan. -->
      <p class="rail-masthead" id="rail-masthead" aria-hidden="true"></p>
    </aside>

    <header class="masthead">
      <nav class="departments" aria-label="Library">
        <!-- Not a shelf either: what is underway and what has arrived. It is
             where the player opens, so it is the first thing in the row. -->
        <a href="#/home" data-section="home">Home</a>
        <a href="#/movies" data-section="movies">Movies<span class="n" id="n-movies"></span></a>
        <a href="#/series" data-section="series">Series<span class="n" id="n-series"></span></a>
        <a href="#/tutorials" data-section="tutorials">Tutorials<span class="n" id="n-tutorials"></span></a>
        <a href="#/collections" data-section="collections">Collections<span class="n" id="n-collections"></span></a>
      </nav>
      <div class="library-toolbar">
        <div class="search-field" role="search">
          <label for="search" class="sr-only">Search</label>
          <!-- An icon until it is used: it opens to a field on focus, so the
               bar stays as quiet as the front page's. -->
          <input type="search" id="search" class="search" placeholder="Search titles and summaries"
                 autocomplete="off" spellcheck="false" />
        </div>
        <!-- A profile is a convenience, not a login. -->
        <button id="who" class="who-button" hidden></button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div class="loading-state" role="status">
        <p>Loading your library…</p>
        <div class="loading-posters" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </main>

    <!-- What the whole library adds up to, set where a book prints the same
         kind of fact. -->
    <footer class="colophon" id="foot"></footer>

    <!-- The screening room stays dark in both library themes. Fullscreen:
         the picture fills the window and controls fade when the pointer rests. -->
    <!-- The Featured reel: the lobby of the screening room, dark for the same
         reason. Its slides and controls are drawn by featured-reel.js. -->
    <dialog id="featured" class="featured" aria-label="Featured films"></dialog>

    <dialog id="player">
      <!-- No `controls`. This player draws its own, and the browser's were a
           second bar underneath them in a second typeface on a second fade
           timer. `preload="auto"` with no autoplay anywhere — opening a title
           fills the buffer and then waits for the viewer. -->
      <video id="video" preload="auto" crossorigin="anonymous"></video>

      <div class="hud hud-top">
        <span class="what" id="now"></span>
        <!-- What the file is, which the catalogue says nowhere else at this
             length. Set quieter than the title: it answers a question a
             viewer only sometimes has. -->
        <span class="tech" id="tech"></span>
        <button id="close" class="ghost">Close</button>
      </div>

      <!-- The bottom rail, in three rows: what is true of the title, where in
           it the viewer is, and the controls. The only controls there are. -->
      <div class="hud hud-bottom">
        <!-- What is true of the title, and what can be done with it. Above the
             transport rather than beside it: none of it acts on the picture. -->
        <div class="rail">
          <span class="ends" id="ends"></span>
          <!-- Preloading without playing means a still frame and no sign of
               life; this is the sign of life. -->
          <span class="preload" id="preload"></span>
          <span class="spacer"></span>
          <!-- Survives cancelling the countdown, which is the point: saying
               "not automatically" must not mean "not at all". -->
          <button id="play-next" class="ghost" hidden>Play next</button>
          <button id="watchlist" class="ghost" aria-pressed="false">Watchlist</button>
          <button id="kids" class="ghost" aria-pressed="false">Kids</button>
          <button id="add-to" class="ghost">Add to…</button>
          <button id="notes" class="ghost" hidden aria-expanded="false">Notes</button>
        </div>

        <!-- One bar for both ways a title plays, scaled to the film's running
             time and never to the media element's: a conversion is encoded as
             it plays, so its clock counts from wherever ffmpeg began and its
             duration reaches only as far as ffmpeg has got. -->
        <div class="seek" id="seek" hidden>
          <label for="seek-to">Position</label>
          <input type="range" id="seek-to" min="0" step="1" value="0" />
        </div>

        <!-- The transport, in the shape the phone already shipped: skip ten,
             play, skip ten, with elapsed at one end and the running time at
             the other. Centred by a three-column grid rather than by the
             widths of what flanks it, so it does not drift when a picker
             appears. -->
        <div class="bar">
          <span class="bar-side">
            <span class="at" id="at-now">0:00</span>
            <span class="picker" id="audio" hidden>
              <label for="audio-track">Audio</label>
              <select id="audio-track"></select>
            </span>
            <!-- Beside the audio picker, which is the whole point of moving
                 it here: they are the same kind of choice. -->
            <span class="picker" id="subs" hidden>
              <label for="sub-track">Subtitles</label>
              <select id="sub-track"></select>
            </span>
            <span class="picker" id="speed">
              <label for="speed-rate">Speed</label>
              <select id="speed-rate"></select>
            </span>
          </span>

          <span class="transport">
            <button id="skip-back" class="tsp" aria-label="Back ten seconds">10</button>
            <button id="play-pause" class="tsp big" aria-label="Play"></button>
            <button id="skip-forward" class="tsp" aria-label="Forward ten seconds">10</button>
          </span>

          <span class="bar-side end">
            <span class="volume">
              <button id="mute" class="tsp" aria-label="Mute"></button>
              <label for="volume">Volume</label>
              <input type="range" id="volume" min="0" max="1" step="0.01" value="1" />
            </span>
            <button id="fullscreen" class="tsp" aria-label="Fullscreen"></button>
            <span class="at" id="at-end"></span>
          </span>
        </div>

        <p class="note" id="note" hidden></p>
      </div>

      <!-- Appears as a title runs out. Counts down and goes on its own unless
           stopped, which is what a run of episodes wants; cancelling is
           remembered for that title so rewatching the last minute does not
           start the countdown again. -->
      <div class="up-next" id="up-next" hidden>
        <span class="up-next-label">Up next</span>
        <span class="up-next-title" id="up-next-title"></span>
        <span class="up-next-in" id="up-next-in"></span>
        <div class="up-next-buttons">
          <button id="up-next-cancel" class="ghost">Cancel</button>
          <button id="up-next-play" class="ghost">Play now</button>
        </div>
      </div>

      <!-- A column beside the picture rather than a panel over it: a lesson's
           notes are several screens of text, and text laid over a video is
           something in the way. The video gives up the width. -->
      <aside class="notes" id="notes-panel" hidden>
        <header class="notes-head">
          <span>Notes</span>
          <button id="notes-close" class="ghost" aria-label="Close notes">✕</button>
        </header>
        <div class="notes-body" id="summary"></div>
      </aside>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
