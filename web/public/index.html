<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mediagram</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161a;
        --panel: #1c1f25;
        --line: #2b3038;
        --text: #e8eaed;
        --dim: #9aa3ad;
        --accent: #6aa9ff;
        --warn: #f0b849;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      h1 { font-size: 17px; margin: 0; font-weight: 600; }
      .count { color: var(--dim); font-size: 13px; }
      main { max-width: 900px; margin: 0 auto; padding: 16px 20px 60px; }
      .group { margin-top: 26px; }
      .group h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--dim);
        margin: 0 0 8px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        padding: 11px 13px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        font: inherit;
        cursor: pointer;
        margin-bottom: 7px;
      }
      .item:hover { border-color: var(--accent); }
      .item .title { flex: 1; min-width: 0; }
      .item .title b { font-weight: 600; display: block; }
      .item .title span {
        color: var(--dim);
        font-size: 13px;
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta { color: var(--dim); font-size: 12px; text-align: right; white-space: nowrap; }
      .badge {
        font-size: 11px;
        color: var(--warn);
        border: 1px solid var(--warn);
        border-radius: 999px;
        padding: 2px 8px;
        white-space: nowrap;
      }
      dialog {
        border: none;
        background: #000;
        padding: 0;
        border-radius: 10px;
        max-width: 94vw;
        color: var(--text);
      }
      dialog::backdrop { background: rgba(0, 0, 0, 0.78); }
      video { display: block; max-width: 94vw; max-height: 80vh; background: #000; }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        background: var(--panel);
      }
      .bar button {
        background: none;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
        font: inherit;
      }
      .empty, .error { color: var(--dim); padding: 30px 0; }
      .error { color: #ff8a80; }
    </style>
  </head>
  <body>
    <header>
      <h1>mediagram</h1>
      <span class="count" id="count"></span>
    </header>
    <main id="main"><p class="empty">Loading…</p></main>

    <dialog id="player">
      <video id="video" controls preload="metadata"></video>
      <div class="bar">
        <span id="now"></span>
        <button id="close">Close</button>
      </div>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
