<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kopfnuss arena mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=block" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --felt: #0f5a43; --felt-deep: #0a4433; --ink: #0c2a22; --card: #fbf8f1; --card-edge: #ddd3bd;
    --blue: #2c6bed; --orange: #f2862e; --yellow: #f6c731; --pink: #e5487f;
    --display: "Bricolage Grotesque", system-ui, sans-serif; --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  canvas { position: absolute; inset: 0; }
  #hud { position: absolute; inset: 0; font-family: var(--body); color: var(--card); pointer-events: none; }
  .bar { position: absolute; left: 60px; right: 60px; top: 34px; display: flex; justify-content: space-between;
    font-weight: 700; font-size: 26px; text-shadow: 0 2px 6px rgb(0 0 0 / .45); }
  .q { position: absolute; left: 60px; right: 60px; top: 86px; background: var(--card); color: var(--ink);
    border-radius: 34px; padding: 30px 46px 32px; box-shadow: 0 10px 0 var(--card-edge), 0 18px 40px rgb(0 0 0 / .35); }
  .q h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 58px; line-height: 1.05; letter-spacing: -.01em; }
  .q .meter { margin-top: 20px; height: 14px; border-radius: 7px; background: #e6dcc6; overflow: hidden; }
  .q .meter i { display: block; height: 100%; width: 68%; background: var(--ink); border-radius: 7px; }
  .answers { position: absolute; left: 60px; right: 60px; display: grid; gap: 18px; }
  .a { border-radius: 22px; padding: 18px 28px; font-family: var(--display); font-weight: 800; font-size: 36px; color: var(--ink);
    display: flex; gap: 16px; align-items: center; box-shadow: 0 7px 0 rgb(0 0 0 / .28); }
  .a.dim { background: rgb(10 68 51 / .86) !important; color: #cfe5dc; box-shadow: none; }
  .a.right { outline: 6px solid var(--card); outline-offset: 3px; }
  [data-theme=studio] .a.dim, [data-theme=neon] .a.dim { background: rgb(8 13 34 / .9) !important; color: #b8c6ff; }
  [data-theme=neon] .a.dim { box-shadow: inset 0 0 0 2px rgb(63 216 255 / .45); }
  .tag { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap; }
  .tag b { display: inline-block; background: rgb(12 42 34 / .82); color: var(--card); font-weight: 700; font-size: 24px;
    padding: 4px 14px; border-radius: 999px; }
  .tag .pts { display: block; margin-top: 4px; font-family: var(--display); font-weight: 800; font-size: 28px; color: var(--yellow);
    text-shadow: 0 2px 6px rgb(0 0 0 / .5); }
  .trick { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; }
  .trick span { display: inline-block; margin: 0 3px; background: var(--pink); color: #fff; font-weight: 700; font-size: 21px;
    padding: 3px 12px; border-radius: 999px; box-shadow: 0 3px 0 #a92d5a; }
  .card { position: absolute; background: var(--card); color: var(--ink); border-radius: 30px; padding: 26px 40px;
    box-shadow: 0 9px 0 var(--card-edge), 0 18px 40px rgb(0 0 0 / .35); }
  .card h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 800; font-size: 44px; }
  .card p { margin: 0; font-size: 30px; line-height: 1.3; }
  .label { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 800; font-size: 34px;
    color: var(--ink); text-align: center; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hud"></div>
<script type="module" src="./arena.js?v=fx4"></script>
</body>
</html>
