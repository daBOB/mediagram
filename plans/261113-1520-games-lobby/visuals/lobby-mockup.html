<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Spieleabend mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=block" rel="stylesheet">
<style>
:root {
  --felt: #0f5a43; --felt-deep: #0a4433; --felt-line: #1c7258; --ink: #0c2a22;
  --card: #fbf8f1; --card-edge: #ddd3bd; --muted: #a9cdbf; --yellow: #f6c731;
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--felt); color: var(--card); font-family: var(--body); }
.stage { position: absolute; inset: 0; }
.backdrop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.kicker { font: 700 26px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; }
.title { font: 800 120px/1 var(--display); letter-spacing: -.02em; margin: 14px 0 0; }
.sub { font-size: 30px; color: rgba(251,248,241,.85); margin: 12px 0 0; }
.status { display: inline-block; margin-top: 22px; font-size: 28px; padding: 10px 20px; border-radius: 10px; background: rgba(10,68,51,.85); }
.status b { color: var(--yellow); }
.row { display: flex; gap: 22px; align-items: flex-end; }
.poster { flex: none; aspect-ratio: 2/3; border-radius: 6px; overflow: hidden; background: var(--felt-deep); position: relative; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.poster .name { position: absolute; left: 12px; bottom: 12px; font: 700 26px var(--display); }
.poster.focus { transform: scale(1.1); transform-origin: bottom center; outline: 6px solid var(--yellow); outline-offset: 0; z-index: 2; }
.poster.off img { filter: grayscale(.85) brightness(.55); }
.poster.off::after { content: attr(data-why); position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px; font-size: 18px; background: rgba(12,42,34,.9); }
.qr { background: var(--card); border-radius: 18px; box-shadow: 0 6px 0 var(--card-edge); padding: 18px; }
.qr img { display: block; width: 100%; height: auto; }
.url { font-size: 26px; color: var(--muted); }
.seat { display: flex; align-items: center; gap: 16px; font: 700 34px var(--display); }
.seat img { width: 64px; height: 64px; border-radius: 50%; background: var(--c); }
.empty { font-size: 28px; color: var(--muted); }
.btn { display: inline-block; font: 700 28px var(--display); padding: 14px 26px; border-radius: 12px; background: rgba(28,114,88,.9); }
.label { position: absolute; left: 50%; transform: translateX(-50%); top: 16px; z-index: 9; font: 700 22px var(--body); background: #000c; color: #fff; padding: 6px 12px; border-radius: 6px; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const art = "../../../android/spieltisch/src/main/res/drawable-nodpi/";
const av = "../../../crates/mediagram-game/client/public/avatars/";
const games = [
  ["quiz", "Buzzer-Quiz"], ["poster", "Poster-Raten"], ["kopfnuss", "Kopfnuss"], ["dreifelder", "Dreifelder"],
  ["preisfrage", "Preisfrage"], ["race", "Heimlauf"], ["grand_allee", "Grand Allee"], ["fluechtig", "Flüchtig"],
  ["mau_mau", "Mau-Mau"], ["schwimmen", "Schwimmen"], ["durak", "Durak"],
];
const noArt = new Set(["grand_allee"]);
const [layout, state] = (location.hash.slice(1) || "a-full").split("-");
const full = state === "full";
const players = full ? [["Ana", "piglet", "#e5487f", true], ["Ben", "fox", "#1bbf8a"], ["Dana", "android", "#2c6bed"]] : [];
const FOCUS = 4;

const poster = (g, i, w) => {
  const [kind, name] = g;
  // with three at the table nothing is blocked; empty table: games needing 2 show why
  const cls = ["poster", i === FOCUS ? "focus" : ""].join(" ");
  const img = noArt.has(kind) ? `<span class="name">${name}</span>` : `<img src="${art}game_poster_${kind}.webp">`;
  return `<div class="${cls}" style="width:${w}px">${img}</div>`;
};
const seats = (size = 64) => players.length
  ? players.map(([n, a, c, lead]) => `<div class="seat" style="--c:${c}"><img src="${av}${a}-head.webp" style="width:${size}px;height:${size}px">${n}${lead ? " ★" : ""}</div>`).join("")
  : `<p class="empty">Noch niemand am Tisch.</p>`;
const status = full
  ? `<span class="status">OK startet Preisfrage · <b>Ana</b> kann auch am Handy starten</span>`
  : `<span class="status">Zum Mitspielen: Handy-Kamera auf den Code</span>`;
const head = `<p class="kicker">Spieleabend</p><h1 class="title">Preisfrage</h1><p class="sub">1–8 Spieler · Wer schätzt den Preis am nächsten?</p>${status}`;
const backdrop = `<img class="backdrop" src="${art}game_backdrop_preisfrage.webp">`;
const url = "192.168.0.42:18083";
const S = document.getElementById("stage");
const labels = { a: "A · Regal, Tisch oben rechts", b: "B · Tischleiste oben", c: "C · Tisch links, Spiele rechts" };

if (layout === "a") {
  const qr = full ? 230 : 330;
  S.innerHTML = `${backdrop}
  <div style="position:absolute;left:96px;top:80px;width:1100px">${head}</div>
  <div style="position:absolute;right:96px;top:64px;width:${qr + 76}px;display:flex;flex-direction:column;gap:16px;background:rgba(10,68,51,.92);border-radius:22px;padding:20px">
    <div class="qr"><img src="sample-qr.svg"></div>
    <div class="url" style="text-align:center">${url}</div>
    <div style="display:flex;flex-direction:column;gap:12px">${seats(52)}</div>
    <span class="btn" style="text-align:center;font-size:24px;padding:10px">Einstellungen</span>
  </div>
  <div style="position:absolute;left:96px;right:96px;bottom:64px">
    <div class="row" style="overflow:hidden;padding-top:40px">${games.map((g, i) => poster(g, i, 214)).join("")}</div>
  </div>`;
}
if (layout === "b") {
  const qr = full ? 150 : 300;
  S.innerHTML = `${backdrop}
  <div style="position:absolute;left:0;right:0;top:0;height:${full ? 210 : 380}px;background:linear-gradient(rgba(10,68,51,.96),rgba(10,68,51,.86));display:flex;align-items:center;justify-content:space-between;padding:0 96px;border-bottom:2px solid var(--felt-line)">
    <div>
      <p class="kicker" style="margin-bottom:18px">Am Tisch${full ? " · 3" : ""}</p>
      <div style="display:flex;gap:40px">${seats(72)}</div>
    </div>
    <div style="display:flex;align-items:center;gap:28px">
      <div style="text-align:right"><div style="font:800 ${full ? 34 : 52}px/1.1 var(--display)">Mitspielen?<br>Kamera auf den Code</div><div class="url" style="margin-top:10px">${url}</div></div>
      <div class="qr" style="width:${qr + 36}px;padding:16px"><img src="sample-qr.svg"></div>
    </div>
  </div>
  <div style="position:absolute;left:96px;top:${full ? 270 : 430}px;width:1100px"><h1 class="title" style="margin:0;font-size:${full ? 120 : 96}px">Preisfrage</h1><p class="sub">1–8 Spieler · Wer schätzt den Preis am nächsten?</p>${full ? status : ""}</div>
  <div style="position:absolute;left:96px;right:96px;bottom:64px">
    <div class="row" style="overflow:hidden;padding-top:40px">${games.map((g, i) => poster(g, i, full ? 214 : 190)).join("")}</div>
  </div>`;
}
if (layout === "c") {
  const qr = full ? 300 : 420;
  S.innerHTML = `${backdrop}
  <div style="position:absolute;left:0;top:0;bottom:0;width:600px;background:var(--felt);box-shadow:8px 0 40px rgba(0,0,0,.4);padding:72px 64px;display:flex;flex-direction:column;gap:20px">
    <p class="kicker">Spieleabend</p>
    <div style="font:800 44px/1.05 var(--display)">Handy-Kamera<br>auf den Code</div>
    <div class="qr" style="width:${qr + 36}px"><img src="sample-qr.svg"></div>
    <div class="url">${url}</div>
    <p class="kicker" style="margin-top:14px">Am Tisch</p>
    <div style="display:flex;flex-direction:column;gap:12px">${seats(56)}</div>
    <div style="margin-top:auto"><span class="btn">Einstellungen</span></div>
  </div>
  <div style="position:absolute;left:680px;right:80px;top:72px">
    <h1 class="title" style="margin:0;font-size:100px">Preisfrage</h1><p class="sub">1–8 Spieler · Wer schätzt den Preis am nächsten?</p>${full ? `<span class="status">OK startet · <b>Ana</b> kann auch am Handy starten</span>` : ""}
  </div>
  <div style="position:absolute;left:680px;right:80px;bottom:60px;display:grid;grid-template-columns:repeat(6,1fr);gap:22px 22px;align-items:end">${games.map((g, i) => poster(g, i, 180)).join("")}</div>`;
}
S.insertAdjacentHTML("afterbegin", `<span class="label">${labels[layout]} · ${full ? "3 am Tisch" : "noch niemand da"}</span>`);
</script>
</body>
</html>
