  (a model-railway diorama on a table, seen through a macro lens)?
  Three boards in that style, switchable via ?variant=A|B|C (← / → or the bar at the bottom):
    A Lebensberg  – a terraced mountain, the road spirals up from spring meadow to snow
    B Inselreich  – one island per life stage in resin water, seasons spring to winter, wooden piers
    C Feldflur    – a flat model-railway plate: patchwork farmland, hedges, a country road
  Players drive die-cast convertibles that seat a partner and up to four children; everyone ages along the path.
  Camera: Auto (follows the driving car, pulls back to the overview at STOP fields), Übersicht, Fokus, Frei (drag).
  Params: cam=auto|over|focus|free, at=<route index of the driving car>, labels=0, ao=0, dof=0.
  Textures and the HDRI are Poly Haven CC0, loaded from their CDN; three 0.170.0 like the game client.
-->

      // hedgerows between the rows, a copse at each turn
      for (let j = 0; j < rows - 1; j++) { const z = z0 - j * rowGap - rowGap / 2; for (let x = -BW / 2 + 2.5; x < BW / 2 - 2.5; x += .16 + rnd() * .22) { if (rnd() < .12 || !free(x, z, .15)) continue; take(x, z, .12); const b = bush(TREE_COLORS[1][Math.floor(rnd() * 3)], Math.floor(rnd() * 99)); b.scale.setScalar(.9 + rnd() * .9); b.rotation.y = rnd() * 6; place(b, x, z + (rnd() - .5) * .25); } }
      let n = 0; for (let t = 0; t < 6000 && n < rows * 16; t++) { const x = (rnd() - .5) * (BW - 1), z = (rnd() - .5) * (BD - 1); if (!free(x, z, .42)) continue; take(x, z, .42); n++;
        const near = fields.reduce((b, f) => Math.hypot(f.p.x - x, f.p.z - z) < Math.hypot(b.p.x - x, b.p.z - z) ? f : b); scatterTree(place, near.stage, rnd, x, z); }
    } };
}

// ───────────────────────── run one variant ─────────────────────────
const VARIANTS = { A: variantA, B: variantB, C: variantC };
const KEYS = Object.keys(VARIANTS);
let W = null, current = null;
const camState = { mode: Q.get('cam') || 'auto', at: new V3(), dist: 30, pitch: .9, az: 0, overUntil: 0, snap: true };

function setup(key) {
  const V = VARIANTS[key](); current = key;
  const w = makeWorld(V);
  const sun = new THREE.DirectionalLight('#ffe9cf', 3.2), ext = Math.max(V.bounds.w, V.bounds.d) * .62;
  sun.position.copy(V.bounds.at).addScaledVector(V.sun.clone().normalize(), 80); sun.target.position.copy(V.bounds.at);
  sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -ext, right: ext, top: ext, bottom: -ext, near: 1, far: 200 });
  sun.shadow.bias = -.0003; sun.shadow.normalBias = .02; w.scene.add(sun, sun.target);
  w.labels.visible = Q.get('labels') !== '0';
  w.cars = PLAYERS.map((src, i) => {
    const pl = { ...src, kids: [], partner: null }, route = routeFor(pl.choices), holder = new THREE.Group(); w.scene.add(holder);
    const car = { pl, route, holder, idx: 0, u: 0, heading: null, sig: '', built: null, lane: (i - 1.5) * .2 };
    const start = i === 0 ? Math.min(route.length - 1, +(Q.get('at') || 0)) : Math.round((src.at || 0) * (route.length - 1));
    for (let j = 0; j <= start; j++) arrive(car, route[j], i !== 0);
    car.idx = start; return car;
  });
  w.driver = w.cars[0]; w.driver.state = 'pause'; w.driver.wait = 1.2;
  renderPass.scene = gtao.scene = bokeh.scene = w.scene; W = w; W.V = V;
  document.getElementById('vlabel').textContent = `${key} · ${V.name}`;
  document.getElementById('sub').textContent = `${FIELD_COUNT} Felder · Original ${ORIGINAL_FIELDS} (147 + Start und Ziele) × ${String(MORE).replace('.', ',')} · Drehrad 1–10`;
  camState.snap = true; camState.overUntil = performance.now() / 1000 + 2.5;
  history.replaceState(null, '', '?' + new URLSearchParams({ ...Object.fromEntries(Q), variant: key }).toString());
}
// What happens to a family on a field: marriage adds the partner, baby fields add a child (passing counts, for the demo).
// quiet: a parked player placed mid-board gets its preset family instead of the baby fields it skipped.
function arrive(car, f, quiet) {
  if (f.label === 'Hochzeit' && !car.pl.partner) addPartner(car.pl);
  if (f.kind === 'baby' && !quiet) addKid(car.pl, f.age);
  if (quiet && car.pl.family) { if (car.pl.family.partner && !car.pl.partner && f.age > 27) addPartner(car.pl); while ((car.pl.kids?.length || 0) < (car.pl.family.kids || 0) && f.age > 30 + car.pl.kids.length * 3) addKid(car.pl, f.age); }
}
function carPose(car) {
  const a = car.route[car.idx], b = car.route[Math.min(car.idx + 1, car.route.length - 1)], u = car.u;
  const p = a.p.clone().lerp(b.p, u), dir = b === a ? a.t.clone() : b.p.clone().sub(a.p).setY(0).normalize();
  p.addScaledVector(new V3(-dir.z, 0, dir.x), car.lane);
  return { p, dir, age: a.age + (b.age - a.age) * u };
}
function updateCar(car, dt) {
  const { p, dir, age } = carPose(car), ppl = crew(car.pl, age), sig = ppl.map(q => q ? Math.floor(q.age / 2) : '-').join(',');
  if (sig !== car.sig) { car.sig = sig; if (car.built) car.holder.remove(car.built.g); car.built = buildCar(car.pl.color, ppl, AVATARS.get(car.pl.avatar)); car.holder.add(car.built.g); }
  car.holder.position.copy(p);
  const want = Math.atan2(-dir.z, dir.x); car.heading = car.heading == null ? want : car.heading + Math.atan2(Math.sin(want - car.heading), Math.cos(want - car.heading)) * Math.min(1, dt * 8);
  car.holder.rotation.y = car.heading;
}
function stepDriver(dt) {
  const d = W.driver, r = d.route;
  if (d.state === 'pause') { d.wait -= dt; if (d.wait <= 0) {
    if (d.idx >= r.length - 1) { Object.assign(d.pl, { kids: [], partner: null }); d.idx = 0; d.u = 0; arrive(d, r[0]); d.wait = 1.5; return; }
    const spin = 1 + Math.floor(Math.random() * 10); d.target = d.idx; for (let s = 0; s < spin && d.target < r.length - 1; s++) { d.target++; if (r[d.target].kind === 'stop') break; }
    d.state = 'drive'; } return; }
  d.u += dt * 2.2;
  if (d.u >= 1) { d.u = 0; d.idx++; arrive(d, r[d.idx]);
    if (d.idx >= d.target) { const f = r[d.idx]; d.state = 'pause'; d.wait = f.kind === 'stop' ? 3.2 : 1.3; if (f.kind === 'stop' || d.idx >= r.length - 1) camState.overUntil = performance.now() / 1000 + 3.0; } }
  for (const w of d.built?.wheels || []) w.rotation.z -= dt * 2.2 * SPACING / (.1 * CAR_SCALE);
}

// ───────────────────────── camera: overview, focus, free ─────────────────────────
function overviewPose() {
  const b = W.V.bounds, pitch = THREE.MathUtils.degToRad(W.V.overPitch), half = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const visH = b.d * Math.sin(pitch) + b.h * Math.cos(pitch), dist = Math.max(b.w / (2 * half * camera.aspect), visH / (2 * half * .86)) * 1.0;
  return { at: b.at.clone(), dist, pitch, az: 0 };
}
function focusPose() {
  const { p, dir } = carPose(W.driver), F = W.V.focus;
  return { at: p.clone().addScaledVector(dir, .6), dist: F.dist, pitch: THREE.MathUtils.degToRad(F.pitch), az: W.V.focusAz ? W.V.focusAz(p) : 0 };
}
function updateCamera(dt, now) {
  const m = camState.mode;
  if (m === 'free') { controls.update(); bokeh.uniforms.focus.value = camera.position.distanceTo(controls.target); return; }
  const want = m === 'over' ? 'over' : m === 'focus' ? 'focus' : (now < camState.overUntil ? 'over' : 'focus');
  const P = want === 'over' ? overviewPose() : focusPose(), k = camState.snap ? 1 : 1 - Math.exp(-dt * 2.4);
  camState.at.lerp(P.at, k); camState.dist += (P.dist - camState.dist) * k; camState.pitch += (P.pitch - camState.pitch) * k;
  camState.az += Math.atan2(Math.sin(P.az - camState.az), Math.cos(P.az - camState.az)) * k; camState.snap = false;
  const c = Math.cos(camState.pitch);
  camera.position.set(Math.sin(camState.az) * c, Math.sin(camState.pitch), Math.cos(camState.az) * c).multiplyScalar(camState.dist).add(camState.at);
  camera.lookAt(camState.at); controls.target.copy(camState.at);
  // macro lens: the closer the camera, the shallower the depth of field
  bokeh.uniforms.focus.value = camState.dist; bokeh.uniforms.aperture.value = .009 / camState.dist;
}
function setCam(m) { if (m === 'free') controls.target.copy(camState.at); camState.mode = m; document.querySelectorAll('[data-cam]').forEach(b => b.classList.toggle('on', b.dataset.cam === m)); }
controls.addEventListener('start', () => { if (camState.mode !== 'free') setCam('free'); });

// ───────────────────────── HUD, switcher, loop ─────────────────────────
function hud() {
  document.getElementById('players').innerHTML = W.cars.map((c, i) => {
    const age = Math.round(carPose(c).age), kids = c.pl.kids?.length || 0;
    return `<div class="card p${i === 0 ? ' on' : ''}"><img src="${AVATAR_HEAD(c.pl.avatar)}" alt="" style="border-color:${c.pl.color};background:${c.pl.color}"><div><b>${c.pl.name} · ${age} J.</b><span>${c.pl.partner ? 'verheiratet' : 'ledig'} · ${kids} ${kids === 1 ? 'Kind' : 'Kinder'} · ${STAGES[c.route[c.idx].stage]}</span></div></div>`;
  }).join('');
}
function go(step) { const i = (KEYS.indexOf(current) + step + KEYS.length) % KEYS.length; setup(KEYS[i]); }
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => setCam(b.dataset.cam));
addEventListener('keydown', e => {
  if (e.target.closest?.('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'ArrowRight') go(1);
  else if (e.key === ' ') { e.preventDefault(); setCam(camState.mode === 'focus' ? 'over' : 'focus'); }
  else if (e.key === 'l' || e.key === 'L') W.labels.visible = !W.labels.visible;
});

try { await Promise.race([document.fonts.load('700 44px "Bricolage Grotesque"'), new Promise(r => setTimeout(r, 2500))]); } catch { /* labels fall back to system-ui */ }
await loadAvatars();
setup(KEYS.includes(Q.get('variant')) ? Q.get('variant') : 'A');
// for QA scripts driving the page from outside
window.DBG = { get W() { return W; }, camera, controls, setCam, THREE, renderer,
  // one frame from a fixed eye onto a target (QA close-ups; the animation loop is stopped in still mode)
  shot(eye, at) { setCam('free'); camera.position.set(...eye); controls.target.set(...at); camera.lookAt(controls.target);
    const d = camera.position.distanceTo(controls.target); bokeh.uniforms.focus.value = d; bokeh.uniforms.aperture.value = .009 / d;
    composer.render(); renderer.autoClear = false; renderer.render(W.labels, camera); renderer.autoClear = true; } };
setCam(camState.mode);
// still=1 renders a few frames once every texture is in, then stops (for screenshots on a CPU renderer)
const STILL = Q.has('still'); let ready = false, stillFrames = 3;
// What the board costs to draw: meshes (≈ draw calls before shadows and post), triangles, materials, textures.
window.boardStats = () => { const mats = new Set(), texs = new Set(); let meshes = 0, tris = 0;
  W.scene.traverseVisible(o => { if (!o.isMesh) return; meshes++; const g = o.geometry, n = g.index ? g.index.count : g.attributes.position.count; tris += n / 3 * (o.isInstancedMesh ? o.count : 1);
    for (const m of [].concat(o.material)) { mats.add(m); for (const v of Object.values(m)) if (v?.isTexture) texs.add(v); } });
  return { meshes, tris: Math.round(tris), materials: mats.size, textures: texs.size }; };
MGR.onLoad = () => { document.title = 'Lebensweg · bereit'; ready = true; };
const clock = new THREE.Clock(); let hudT = 0;
renderer.setAnimationLoop(() => {
  if (STILL && !ready) return;
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime, now = performance.now() / 1000;
  stepDriver(dt);
  for (const c of W.cars) updateCar(c, dt);
  for (const f of W.ticks) f(t);
  updateCamera(dt, now);
  if ((hudT -= dt) <= 0) { hud(); hudT = .25; }
  composer.render();
  renderer.autoClear = false; renderer.render(W.labels, camera); renderer.autoClear = true;
  if (STILL && --stillFrames <= 0) { renderer.setAnimationLoop(null); document.title = 'Lebensweg · fertig'; }
});
</script>
