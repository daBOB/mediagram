[workspace]
resolver = "3"
members = ["crates/mlib-spec", "crates/mediagram", "crates/mediagram-tmdb", "crates/mediagram-core"]

[workspace.package]
version = "0.44.2"
edition = "2024"
license = "MIT"
rust-version = "1.87"
repository = "https://github.com/daBOB/mediagram"
readme = "README.md"
keywords = ["telegram", "media", "video", "library"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.11"
getrandom = "0.4"
hex = "0.4"
ulid = "1"
thiserror = "2"
anyhow = "1.0.104"
base64 = "0.23.1"
flate2 = "1.1.10"
futures = "0.3.34"
# Pinned, not used directly: grammers-crypto 0.10 calls glass_pumpkin's rc0
# `safe_prime::check` (returns bool, takes num-bigint 0.4). rc1 returns a
# Result and moved to num-bigint 0.5, so a plain `cargo update` picks it up
# — both are prereleases of 2.0.0 — and grammers stops compiling. Drop this
# once grammers-crypto builds against rc1.
glass_pumpkin = "=2.0.0-rc0"
grammers-client = "0.10"
# Default features off here so the Android build can leave out the sqlite
# storage; the members that want it turn it back on.
grammers-session = { version = "0.10", default-features = false }
grammers-mtsender = "0.10"
grammers-tl-types = "0.10"
# No TLS provider is named here: every client is built by
# `mediagram_core::http` on ring, and each member adds only the
# features it uses.
# `fallible_uint` reads a size or count column straight into `u64`, refusing
# a negative one instead of wrapping it.
rusqlite = { version = "0.40.2", features = ["fallible_uint"] }
reqwest = { version = "0.13.5", default-features = false }
tar = "0.4.46"
tempfile = "3.27.0"
tokio = "1.53.1"
tracing = "0.1.44"
