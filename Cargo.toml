[workspace]
resolver = "3"
members = ["crates/mlib-spec", "crates/mediagram", "crates/mediagram-tmdb", "crates/mediagram-core"]

[workspace.package]
version = "0.24.0"
edition = "2024"
license = "MIT"
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
hex = "0.4"
ulid = "1"
thiserror = "2"
anyhow = "1.0.104"
base64 = "0.23.1"
flate2 = "1.1.10"
futures = "0.3.34"
# Pinned, not used directly: grammers-crypto 0.10 calls glass_pumpkin's rc0
# `safe_prime::check` (returns bool, takes num-bigint 0.4). rc1 returns a
# Result and moved to num-bigint 0.5, so a plain `cargo update` picks it up
# — both are prereleases of 2.0.0 — and grammers stops compiling. Drop this
# once grammers-crypto builds against rc1.
glass_pumpkin = "=2.0.0-rc0"
grammers-client = "0.10"
grammers-mtsender = "0.10"
grammers-tl-types = "0.10"
# No TLS provider is named here: every client is built by
# `mediagram_core::api::http` on ring, and each member adds only the
# features it uses.
reqwest = { version = "0.13.5", default-features = false }
tar = "0.4.46"
tempfile = "3.27.0"
tokio = "1.53.1"
tracing = "0.1.44"
