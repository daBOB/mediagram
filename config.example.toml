# Copy to ~/.config/mediagram/config.toml. Every key can be overridden with
# MEDIAGRAM_<KEY> in the environment (e.g. MEDIAGRAM_API_HASH).
api_id = 12345                      # from https://my.telegram.org
api_hash = "0123456789abcdef"
channel = "Mediagram"             # channel id like -1001234567890, or exact title
tmdb_key = ""                      # https://www.themoviedb.org/settings/api
                                   # a v3 API key or a v4 read token; either works
# tmdb_language = "en-US"          # BCP-47. TMDB answers in English unless asked,
                                   # so a German library wants "de-DE" or its
                                   # episode titles arrive translated
# part_size = 3758096384           # 3.5 GiB, must be a multiple of 1 MiB
# throttle_ms = 0                  # pause between part uploads
# max_attempts = 5
# tmp_dir = "/fast/scratch"        # faststart remux output; default: next to source
# data_dir = "/var/lib/mediagram"  # session, library.db, tmdb cache; default: XDG data dir
# The playback API has no authentication of its own. Keep it on loopback and
# put a reverse proxy in front of it to reach the library from elsewhere.
# serve_addr = "127.0.0.1:8765"    # where `mediagram serve` listens

# --- prebuilt metadata package (mediagram export-package) -------------------
# A player fetches one encrypted file instead of scanning the channel.
# Generate the key once and keep it: head -c 32 /dev/urandom | base64
# The same value goes into the player. Losing it costs the package, never the
# library.
# package_key = "base64-of-32-random-bytes"
#
# How to publish. Argv, not a shell string: mediagram runs this directly, so a
# failed upload cannot be hidden by a pipeline's exit status. {file} is
# replaced with the path, and stays one argument even with spaces.
# publish_cmd = ["rclone", "copy", "{file}", "r2:mediagram/"]
#
# Where those files end up being served from, used to build the URL inside
# latest.json. Not verified against where publish_cmd actually puts them.
# publish_base_url = "https://example.com/pkgs"
